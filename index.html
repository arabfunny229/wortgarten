<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wortgarten — сад немецких слов</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,450;0,9..144,560;0,9..144,650;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg: #F4F7F1;
    --surface: #FFFFFF;
    --surface-alt: #EDF2E8;
    --border: #DCE4D5;
    --text: #263129;
    --text-muted: #74836F;
    --accent: #4C6B54;
    --accent-dark: #34493B;
    --accent-soft: #DDEBE0;
    --gold: #C99A3B;
    --gold-soft: #F3E6C8;
    --correct-bg: #DCEFDE;
    --correct-text: #2F6B4F;
    --error-bg: #F7DEDA;
    --error-text: #A6432F;
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --shadow: 0 4px 16px rgba(38,49,41,0.07);
    --shadow-sm: 0 1px 4px rgba(38,49,41,0.06);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    background:
      radial-gradient(circle at 12% -10%, #E9F1E2 0%, transparent 45%),
      radial-gradient(circle at 100% 0%, #EFF5EA 0%, transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'Work Sans', system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    max-width: 920px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header.hero{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom: 32px;
  }

  .logo-leaf{
    flex:none;
    width:46px; height:46px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:650;
    font-optical-sizing: auto;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin:0 0 2px;
    color: var(--accent-dark);
  }

  .tagline{
    margin:0;
    color: var(--text-muted);
    font-size: 14.5px;
  }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 22px;
  }

  .add-form{
    display:flex;
    gap:12px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .add-form .field{
    flex:1 1 220px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .field label{
    font-size:12px;
    font-weight:600;
    text-transform: uppercase;
    letter-spacing:.04em;
    color: var(--text-muted);
  }

  input[type="text"]{
    font-family:'Work Sans', sans-serif;
    font-size:15.5px;
    padding: 11px 13px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--surface-alt);
    color: var(--text);
    outline:none;
    transition: border-color .15s ease, background .15s ease;
    width:100%;
  }

  input[type="text"]::placeholder{ color:#9BAA95; }

  input[type="text"]:focus-visible{
    border-color: var(--accent);
    background: var(--surface);
  }

  .add-form button{
    align-self:flex-end;
  }

  button{
    font-family:'Work Sans', sans-serif;
    cursor:pointer;
  }

  .btn{
    border:none;
    border-radius: var(--radius-sm);
    padding: 11px 18px;
    font-size: 14.5px;
    font-weight:600;
    background: var(--accent);
    color: #fff;
    transition: background .15s ease, transform .1s ease;
  }
  .btn:hover{ background: var(--accent-dark); }
  .btn:active{ transform: scale(.97); }

  .pill{
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 15px;
    font-size: 13.5px;
    font-weight:600;
    transition: all .15s ease;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .pill:hover{ border-color: var(--accent); color: var(--accent-dark); }
  .pill.active{
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent-dark);
  }
  .pill.warn.active{
    background: var(--gold-soft);
    border-color: var(--gold);
    color: #8A621C;
  }

  :focus-visible{ outline: 2.5px solid var(--accent); outline-offset: 2px; }

  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin: 22px 0 26px;
  }

  .segmented{
    display:inline-flex;
    border:1.5px solid var(--border);
    border-radius:999px;
    padding:3px;
    background: var(--surface);
    gap:2px;
  }
  .segmented button{
    border:none;
    background:transparent;
    padding: 7px 14px;
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    color: var(--text-muted);
    transition: all .15s ease;
  }
  .segmented button.active{
    background: var(--accent);
    color:#fff;
  }

  .controls-divider{
    width:1px;
    align-self:stretch;
    background: var(--border);
    margin: 0 2px;
  }

  .table-wrap{
    border-radius: var(--radius-lg);
    overflow:hidden;
    border:1px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .table-head, .row{
    display:grid;
    grid-template-columns: 1fr 1.3fr 1fr 46px;
    gap:14px;
    align-items:center;
    padding: 13px 18px;
  }

  .table-wrap.hide-de .table-head,
  .table-wrap.hide-de .row{ grid-template-columns: 1.3fr 1fr 46px; }
  .table-wrap.hide-ru .table-head,
  .table-wrap.hide-ru .row{ grid-template-columns: 1fr 1.3fr 46px; }
  .table-wrap.hide-de.hide-ru .table-head,
  .table-wrap.hide-de.hide-ru .row{ grid-template-columns: 1.3fr 46px; }

  .table-wrap.hide-de .cell-de,
  .table-wrap.hide-ru .cell-ru{ display:none; }

  .table-head{
    background: var(--surface-alt);
    font-size:11.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color: var(--text-muted);
  }

  .row{
    border-top:1px solid var(--border);
    transition: opacity .2s ease, transform .2s ease, background .2s ease;
  }
  .row:hover{ background: #FBFCFA; }
  .row.removing{ opacity:0; transform: translateX(8px) scale(.98); }

  .cell-label{ display:none; }

  .de-text, .ru-text{
    font-size:15.5px;
  }
  .de-text{ font-weight:560; font-family:'Fraunces', serif; color: var(--accent-dark); }
  .ru-text{ color: var(--text); }

  .cell-practice{
    position:relative;
    display:flex;
    align-items:center;
    gap:8px;
  }

  .practice-input{
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size:15px;
    border: 1.5px solid var(--border);
    background: var(--surface-alt);
    flex:1;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .practice-input.correct{
    background: var(--correct-bg);
    border-color: #9FCFAE;
    color: var(--correct-text);
    font-weight:600;
  }
  .practice-input.incorrect{
    background: var(--error-bg);
    border-color: #E5A99D;
    color: var(--error-text);
  }

  .error-badge{
    flex:none;
    min-width:22px;
    height:22px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11.5px;
    font-weight:700;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
    background: var(--surface);
    padding: 0 5px;
  }
  .error-badge.hidden-zero{ visibility:hidden; }
  .error-badge.tier-1{ background:#FBEFD6; border-color:#E7C877; color:#8A621C; }
  .error-badge.tier-2{ background:#FBE3D4; border-color:#E7A877; color:#93481A; }
  .error-badge.tier-3{ background: var(--error-bg); border-color:#E5A99D; color: var(--error-text); }

  .delete-btn{
    flex:none;
    width:30px; height:30px;
    border-radius:999px;
    border:none;
    background:transparent;
    color:#AEB9A8;
    font-size:17px;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: all .15s ease;
  }
  .delete-btn:hover{ background: var(--error-bg); color: var(--error-text); }

  .empty-state{
    padding: 40px 20px;
    text-align:center;
    color: var(--text-muted);
    font-size: 14.5px;
  }

  footer.stats-bar{
    margin-top: 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 0 4px;
  }
  footer.stats-bar .reset-link{
    background:none;
    border:none;
    color: var(--text-muted);
    text-decoration: underline;
    text-underline-offset: 2px;
    font-size: 13px;
    padding:0;
  }
  footer.stats-bar .reset-link:hover{ color: var(--error-text); }

  @media (max-width: 680px){
    .table-head{ display:none; }
    .table-wrap .row,
    .table-wrap.hide-de .row,
    .table-wrap.hide-ru .row,
    .table-wrap.hide-de.hide-ru .row{
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 16px 16px;
    }
    .cell-label{
      display:block;
      font-size:10.5px;
      font-weight:700;
      text-transform:uppercase;
      letter-spacing:.05em;
      color: var(--text-muted);
      margin-bottom:3px;
    }
    .cell-de, .cell-ru{ position:relative; }
    .delete-btn{ position:absolute; top:10px; right:10px; }
    .row{ position:relative; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="hero">
    <svg class="logo-leaf" viewBox="0 0 48 48" fill="none">
      <path d="M9 39C9 22 20 9 39 9C39 28 26 39 9 39Z" fill="#DDEBE0" stroke="#4C6B54" stroke-width="2" stroke-linejoin="round"/>
      <path d="M11 37C18 27 24 21 34 14" stroke="#4C6B54" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <div>
      <h1>Wortgarten</h1>
      <p class="tagline">Твой сад немецких слов — выращивай словарный запас каждый день</p>
    </div>
  </header>

  <div class="card">
    <div class="add-form">
      <div class="field">
        <label for="input-de">Слово на немецком</label>
        <input type="text" id="input-de" placeholder="напр. der Tisch">
      </div>
      <div class="field">
        <label for="input-ru">Перевод на русском</label>
        <input type="text" id="input-ru" placeholder="напр. стол">
      </div>
      <button class="btn" id="add-btn">Добавить в список</button>
    </div>

    <div class="controls">
      <button class="pill" id="toggle-de">Скрыть немецкий</button>
      <button class="pill" id="toggle-ru">Скрыть русский</button>

      <div class="controls-divider"></div>

      <div class="segmented" id="mode-switch">
        <button class="mode-btn active" data-mode="de-ru">DE → RU</button>
        <button class="mode-btn" data-mode="ru-de">RU → DE</button>
      </div>

      <div class="controls-divider"></div>

      <button class="pill" id="shuffle-words">🔀 Перемешать</button>
      <button class="pill" id="clear-answers">Очистить введённое</button>
      <button class="pill warn" id="filter-hard">Сложные слова</button>
    </div>

    <div class="table-wrap" id="table-wrap">
      <div class="table-head">
        <span>Немецкий</span>
        <span>Тренировка</span>
        <span>Русский</span>
        <span></span>
      </div>
      <div id="table-body"></div>
    </div>

    <footer class="stats-bar">
      <span id="stats-text"></span>
      <button class="reset-link" id="reset-errors">Сбросить статистику ошибок</button>
    </footer>
  </div>

</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "wortgarten:data:v1";

  var defaultWords = [
    { de: "der Tisch", ru: "стол" },
    { de: "das Haus", ru: "дом" },
    { de: "lernen", ru: "учить" },
    { de: "die Katze", ru: "кошка" },
    { de: "schön", ru: "красивый" },
    { de: "sprechen", ru: "говорить" },
    { de: "das Wasser", ru: "вода" },
    { de: "gut", ru: "хорошо" }
  ];

  function makeId(){
    return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("w-" + Date.now() + "-" + Math.random().toString(16).slice(2));
  }

  function loadState(){
    var raw;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    if(raw){
      try{
        var parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.words)){
          return {
            words: parsed.words,
            showDe: parsed.showDe !== false,
            showRu: parsed.showRu !== false,
            mode: parsed.mode === "ru-de" ? "ru-de" : "de-ru",
            filterHard: false
          };
        }
      }catch(e){ /* fall through to defaults */ }
    }
    return {
      words: defaultWords.map(function(w){
        return { id: makeId(), de: w.de, ru: w.ru, answer: "", errorCount: 0, errorCounted: false };
      }),
      showDe: true,
      showRu: true,
      mode: "de-ru",
      filterHard: false
    };
  }

  var state = loadState();
  var storageAvailable = true;

  function save(){
    if(!storageAvailable) return;
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        words: state.words,
        showDe: state.showDe,
        showRu: state.showRu,
        mode: state.mode
      }));
    }catch(e){
      storageAvailable = false;
    }
  }

  function normalize(str){
    return (str || "").trim().toLowerCase();
  }

  function targetFor(word){
    return state.mode === "de-ru" ? word.ru : word.de;
  }

  function statusFor(word){
    var val = normalize(word.answer);
    if(val === "") return "empty";
    return val === normalize(targetFor(word)) ? "correct" : "incorrect";
  }

  // ----- DOM refs -----
  var tableBody = document.getElementById("table-body");
  var tableWrap = document.getElementById("table-wrap");
  var statsText = document.getElementById("stats-text");
  var inputDe = document.getElementById("input-de");
  var inputRu = document.getElementById("input-ru");

  function errorTier(count){
    if(count <= 0) return "";
    if(count <= 2) return "tier-1";
    if(count <= 4) return "tier-2";
    return "tier-3";
  }

  function render(){
    tableWrap.classList.toggle("hide-de", !state.showDe);
    tableWrap.classList.toggle("hide-ru", !state.showRu);

    document.getElementById("toggle-de").textContent = state.showDe ? "Скрыть немецкий" : "Показать немецкий";
    document.getElementById("toggle-de").classList.toggle("active", !state.showDe);
    document.getElementById("toggle-ru").textContent = state.showRu ? "Скрыть русский" : "Показать русский";
    document.getElementById("toggle-ru").classList.toggle("active", !state.showRu);

    document.querySelectorAll(".mode-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.mode === state.mode);
    });

    var filterBtn = document.getElementById("filter-hard");
    filterBtn.classList.toggle("active", state.filterHard);
    filterBtn.textContent = state.filterHard ? "Показать все слова" : "Сложные слова";

    var visible = state.words.filter(function(w){
      return !state.filterHard || w.errorCount > 0;
    });

    tableBody.innerHTML = "";

    if(state.words.length === 0){
      tableBody.innerHTML = '<div class="empty-state">Список пока пуст — добавьте своё первое слово выше 🌱</div>';
    } else if(visible.length === 0){
      tableBody.innerHTML = '<div class="empty-state">Сложных слов пока нет — отличная работа! 🌿</div>';
    } else {
      visible.forEach(function(word){
        tableBody.appendChild(renderRow(word));
      });
    }

    var totalErrors = state.words.reduce(function(sum, w){ return sum + w.errorCount; }, 0);
    var hardCount = state.words.filter(function(w){ return w.errorCount > 0; }).length;
    statsText.textContent = "Слов: " + state.words.length + " · Сложных: " + hardCount + " · Всего ошибок: " + totalErrors;

    save();
  }

  function renderRow(word){
    var row = document.createElement("div");
    row.className = "row";
    row.dataset.id = word.id;

    var status = statusFor(word);

    row.innerHTML =
      '<div class="cell cell-de"><span class="cell-label">Немецкий</span><span class="de-text"></span></div>' +
      '<div class="cell cell-practice">' +
        '<input type="text" class="practice-input" autocomplete="off" spellcheck="false">' +
        '<span class="error-badge"></span>' +
      '</div>' +
      '<div class="cell cell-ru"><span class="cell-label">Русский</span><span class="ru-text"></span></div>' +
      '<button class="delete-btn" title="Удалить" aria-label="Удалить слово">×</button>';

    row.querySelector(".de-text").textContent = word.de;
    row.querySelector(".ru-text").textContent = word.ru;

    var input = row.querySelector(".practice-input");
    input.value = word.answer || "";
    input.placeholder = state.mode === "de-ru" ? "перевод на русском…" : "Wort auf Deutsch…";
    input.classList.toggle("correct", status === "correct");
    input.classList.toggle("incorrect", status === "incorrect");

    var badge = row.querySelector(".error-badge");
    badge.textContent = word.errorCount > 0 ? word.errorCount : "";
    badge.classList.add(errorTier(word.errorCount) || "hidden-zero");

    input.addEventListener("input", function(){
      word.answer = input.value;
      var s = statusFor(word);
      input.classList.toggle("correct", s === "correct");
      input.classList.toggle("incorrect", s === "incorrect");
      if(s !== "incorrect"){
        word.errorCounted = false;
      }
      save();
    });

    input.addEventListener("blur", function(){
      var s = statusFor(word);
      if(s === "incorrect" && !word.errorCounted){
        word.errorCount += 1;
        word.errorCounted = true;
        render();
      } else {
        save();
      }
    });

    input.addEventListener("keydown", function(e){
      if(e.key === "Enter") input.blur();
    });

    row.querySelector(".delete-btn").addEventListener("click", function(){
      row.classList.add("removing");
      setTimeout(function(){
        state.words = state.words.filter(function(w){ return w.id !== word.id; });
        render();
      }, 180);
    });

    return row;
  }

  // ----- controls -----
  document.getElementById("add-btn").addEventListener("click", addWord);
  [inputDe, inputRu].forEach(function(el){
    el.addEventListener("keydown", function(e){
      if(e.key === "Enter") addWord();
    });
  });

  function addWord(){
    var de = inputDe.value.trim();
    var ru = inputRu.value.trim();
    if(!de || !ru){
      (de ? inputRu : inputDe).focus();
      return;
    }
    state.words.push({ id: makeId(), de: de, ru: ru, answer: "", errorCount: 0, errorCounted: false });
    inputDe.value = "";
    inputRu.value = "";
    inputDe.focus();
    render();
  }

  document.getElementById("toggle-de").addEventListener("click", function(){
    state.showDe = !state.showDe;
    render();
  });
  document.getElementById("toggle-ru").addEventListener("click", function(){
    state.showRu = !state.showRu;
    render();
  });

  document.querySelectorAll(".mode-btn").forEach(function(btn){
    btn.addEventListener("click", function(){
      state.mode = btn.dataset.mode;
      render();
    });
  });

  document.getElementById("shuffle-words").addEventListener("click", function(){
    for (var i = state.words.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = state.words[i];
      state.words[i] = state.words[j];
      state.words[j] = temp;
    }
    render();
  });

  document.getElementById("clear-answers").addEventListener("click", function(){
    state.words.forEach(function(w){
      w.answer = "";
      w.errorCounted = false;
    });
    render();
  });

  document.getElementById("filter-hard").addEventListener("click", function(){
    state.filterHard = !state.filterHard;
    render();
  });

  document.getElementById("reset-errors").addEventListener("click", function(){
    state.words.forEach(function(w){
      w.errorCount = 0;
      w.errorCounted = false;
    });
    state.filterHard = false;
    render();
  });

  render();
})();
</script>
</body>
</html>
